name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:demo
      - run: npx --yes deno@2.9.6 check --config supabase/functions/deno.json supabase/functions/memory-window/index.ts supabase/functions/stripe-webhook/index.ts
      - run: npx --yes deno@2.9.6 test --allow-env --config supabase/functions/deno.json supabase/functions/_shared/handlers_test.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
